# Reference compose for the voz stack. Deployment on this box uses `docker build`
# + `docker run` against the Engine (see README), because the Engine cannot see
# the Hermes workspace. This file documents the wiring.
#
# 003: `voz` relays to the Hermes `voz` profile and authenticates through `voz-mfa`.
# The app holds no model credential any more; the only secret it carries is the
# API-server key of the Hermes profile it calls.
services:
  voz-mfa:
    image: ghcr.io/legido-ai/voz-mfa:current
    container_name: voz-mfa
    restart: unless-stopped
    environment:
      MFA_DB: /data/mfa.db
      MFA_TTL_SECONDS: "300"          # the code lives 5 minutes
      MFA_MAX_ATTEMPTS: "5"           # then the challenge is dead
      MFA_BOT_TOKEN: ${MFA_BOT_TOKEN} # bot that delivers the number
      MFA_CHAT_ID: ${MFA_CHAT_ID}     # Javier's chat with that bot
      MFA_OUTBOX: "1"                 # keep sent codes for diagnostics
      VOZ_IDLE_MINUTES: "15"          # sliding session, renewed per turn
    volumes:
      - voz-mfa-data:/data
    networks: [voz]

  voz-stt:
    image: speech-to-text:current      # legacy whisper fallback, not deployed
    container_name: voz-stt
    restart: unless-stopped
    environment:
      STT_MODEL: small
      STT_LANGUAGE: es
      STT_COMPUTE_TYPE: int8
      STT_PRELOAD: "true"
      OMP_NUM_THREADS: "2"
    networks: [voz]

  voz-tts:
    image: ghcr.io/legido-ai/voz-tts:current
    container_name: voz-tts
    restart: unless-stopped
    volumes:
      - voz-models:/models:ro
    environment:
      TTS_MODEL_PATH: /models/kokoro-v1.0.int8.onnx
      TTS_VOICES_PATH: /models/voices-v1.0.bin
      OMP_NUM_THREADS: "2"
    networks: [voz]

  voz:
    image: ghcr.io/legido-ai/voz:current
    container_name: voz
    restart: unless-stopped
    depends_on: [voz-mfa, voz-tts]
    environment:
      STT_URL: ""                      # sherpa streaming in process
      TTS_URL: http://voz-tts:9000
      MFA_URL: http://voz-mfa:8000
      HERMES_BASE: http://host.docker.internal:8642/p/voz/v1
      HERMES_MODEL: voz
      HERMES_API_KEY: ${HERMES_API_KEY}
      VOZ_IDLE_MINUTES: "15"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [voz, edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.voz.rule: "Host(`voz.oci2.legido.com`)"
      traefik.http.routers.voz.entrypoints: "websecure"
      traefik.http.routers.voz.tls.certresolver: "le"
      traefik.http.services.voz.loadbalancer.server.port: "9000"

networks:
  voz:
    name: voz-net
  edge:
    external: true

volumes:
  voz-models:
    name: voz-models
  voz-mfa-data:
    name: voz-mfa-data
