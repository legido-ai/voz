<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voz">
<meta name="theme-color" content="#08090c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/static/styles.css">
<title>Voz</title>
</head>
<body>
<header>
  <span class="brand">voz</span>
  <span class="header-right">
    <span id="net" class="dot" aria-hidden="true"></span>
    <button id="hangup" class="ghost" hidden aria-label="Colgar">Colgar</button>
    <button id="settings" class="ghost" aria-label="Ajustes">···</button>
  </span>
</header>

<main>
  <div class="stage">
    <div class="halo" id="halo"></div>
    <button id="mic" class="mic" aria-label="Empezar a hablar">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="ico-mic" d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z"/>
        <path class="ico-mic" d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/>
        <g class="ico-bars">
          <rect x="4" y="9.5" width="2.2" height="5" rx="1.1"/>
          <rect x="8.4" y="6.5" width="2.2" height="11" rx="1.1"/>
          <rect x="12.8" y="4" width="2.2" height="16" rx="1.1"/>
          <rect x="17.2" y="7.5" width="2.2" height="9" rx="1.1"/>
        </g>
      </svg>
    </button>
  </div>

  <p class="status" id="status">Toca y habla</p>
  <p class="caption" id="caption"></p>
  <p class="hint" id="hint">Habla con naturalidad. Interrúmpela cuando quieras.</p>
</main>

<section class="panel" id="panel" hidden>
  <div class="row">
    <label for="voice">Voz</label>
    <select id="voice">
      <option value="es_piper_f">Castellana · femenina (rápida)</option>
      <option value="es_f">Dora · natural, femenina</option>
      <option value="es_m">Álex · natural, masculina</option>
      <option value="es_m2">Santa · natural, masculina</option>
      <option value="es_piper_m">Piper · masculina (rápida)</option>
      <option value="es_carlfm">Carlos · peninsular, medio</option>
      <option value="es_davefx">Voz de España · peninsular, medio</option>
    </select>
  </div>
  <div class="row">
    <label for="speed">Ritmo</label>
    <input id="speed" type="range" min="0.8" max="1.2" step="0.05" value="1">
  </div>
  <div class="row">
    <label for="captions">Transcripción</label>
    <input id="captions" type="checkbox">
  </div>
  <button id="close" class="ghost wide">Cerrar</button>
</section>

<script src="/static/app.js"></script>
</body>
</html>
